<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я тебя люблю</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        .heart {
            font-size: 60px;
            animation: heartbeat 1.2s ease infinite;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.2);
        }

        .message {
            margin-top: 35px;
            padding: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            border-radius: 20px;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.3s ease;
        }

        .message.show {
            opacity: 1;
            transform: scale(1);
        }

        .message-text {
            font-size: 28px;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
        }

        .instruction {
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤️</div>
        <h2>Напиши что-нибудь...</h2>
        <input type="text" id="wordInput" placeholder="Начни печатать..." autocomplete="off">
        <div class="message" id="loveMessage">
            <div class="message-text">❤️ Я ТЕБЯ ЛЮБЛЮ ❤️</div>
        </div>
        <div class="instruction">✨ Напиши любое слово или букву ✨</div>
    </div>

    <script>
        const input = document.getElementById('wordInput');
        const message = document.getElementById('loveMessage');
        
        input.addEventListener('input', function() {
            if (this.value.length > 0) {
                message.classList.add('show');
            } else {
                message.classList.remove('show');
            }
        });
    </script>
</body>
</html>
